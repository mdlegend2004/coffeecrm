# render.yaml — Render Blueprint (Infrastructure-as-Code)
#
# Deploys ONE web service + ONE database:
#   Render Dashboard → New → Blueprint → connect this repo
#
# The CRM runs its built-in delivery simulator (CHANNEL_SERVICE_URL is not set),
# so the separate channel-service is not needed on Render.
#
# When the Blueprint is created, Render asks for the values marked `sync: false`
# (OPENAI_API_KEY and APP_PASSWORD). DATABASE_URL is filled in automatically.
# The database and the service must be in the same region.

databases:
  - name: brewco-postgres
    plan: free
    region: singapore
    databaseName: brewco
    user: brewco

services:
  - type: web
    name: brewco-crm-app
    runtime: python
    plan: free
    region: singapore
    rootDir: crm-service
    healthCheckPath: /health
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: brewco-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false       # you type this when creating the Blueprint
      - key: APP_PASSWORD
        sync: false       # the password your browser will ask for
      - key: APP_USERNAME
        value: admin
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NODE_VERSION
        value: "20.11.1"
